# =============================================================================
# spark-defaults.conf — mounted into spark-master / spark-worker containers.
# Anything here can be overridden per job with `--conf key=value`.
# Values containing ${...} are resolved by the *shell* wrapper in
# jobs/submit/run_job.sh (Spark itself does NOT substitute env vars).
# =============================================================================

# ---------- cluster ----------
spark.master                      spark://spark-master:7077
spark.submit.deployMode           client
spark.eventLog.enabled            true
spark.eventLog.dir                s3a://lakehouse/warehouse/spark-logs
spark.sql.shuffle.partitions      8
spark.sql.adaptive.enabled        true
spark.sql.adaptive.coalescePartitions.enabled true

# keep the console quiet; streaming progress goes to the driver log anyway
spark.ui.showConsoleProgress      false

# ---------- SQL behaviour required by Iceberg ----------
spark.sql.extensions              org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.lake            org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lake.type                       jdbc
spark.sql.catalog.lake.uri                        jdbc:postgresql://postgres:5432/catalog
spark.sql.catalog.lake.catalog-impl                 org.apache.iceberg.jdbc.JdbcCatalog
spark.sql.catalog.lake.warehouse                  s3a://lakehouse/warehouse
spark.sql.catalog.lake.client.factory-id            iceberg
spark.sql.catalog.lake.io-impl                      org.apache.iceberg.aws.s3.S3FileIO
# Hadoop-catalog-style fallback (used by `spark.read.format("iceberg").option("path", ...)`):
spark.sql.catalog.lake_hadoop                       org.apache.iceberg.hadoop.HadoopCatalog
spark.sql.catalog.lake_hadoop.warehouse             s3a://lakehouse/warehouse

# ---------- S3 = MinIO (object storage that physically holds the tables) ----------
spark.hadoop.fs.s3a.access.key    minioadmin
spark.hadoop.fs.s3a.secret.key    minioadmin
spark.hadoop.fs.s3a.endpoint      http://minio:9000
spark.hadoop.fs.s3a.path.style.access true
spark.hadoop.fs.s3a.connection.ssl.enabled false
spark.hadoop.fs.s3a.committer.name directory
spark.hadoop.fs.s3a.fast.upload true
# Iceberg's own S3 client (S3FileIO) also needs endpoint + credentials:
spark.hadoop.fs.s3a.aws.credentials.provider org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
spark.sql.catalog.lake.s3.endpoint                  http://minio:9000
spark.sql.catalog.lake.s3.path-style-access         true

# ---------- Kafka ----------
spark.sql.streaming.checkpointLocation s3a://lakehouse/warehouse/checkpoints
spark.streaming.stopGracefullyOnShutdown true
spark.kafka.consumer.group.id         haweye-spark

# ---------- streaming micro-batch cadence (overridable per job) ----------
spark.sql.streaming.multipleWatermarkPolicy min
